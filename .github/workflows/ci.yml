name: Local App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      DATABASE_URL: 'file:./prisma/dev.db'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare disposable CI database
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build Next.js with type checking enabled
        run: npx next build

      - name: Copy static assets
        run: node scripts/copy-static.js

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Verify desktop bundle invariants
        run: npm run verify
